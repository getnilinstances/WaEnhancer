name: Update Version, Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "WhatsApp version (example: 2.26.31.xx)"
        required: true
        type: string

jobs:
  update-version:
    name: Update Supported Version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Update arrays.xml
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 <<'PY'
          import os
          import re

          path = "app/src/main/res/values/arrays.xml"
          version = os.environ["VERSION"].strip()

          if not re.fullmatch(r"2\.\d+\.\d+\.xx", version):
              raise SystemExit(
                  f"Invalid version: {version}. Expected format: 2.26.31.xx"
              )

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          for array_name in (
              "supported_versions_wpp",
              "supported_versions_business",
          ):
              pattern = (
                  rf'(<string-array name="{array_name}">)'
                  rf'(.*?)'
                  rf'(</string-array>)'
              )

              match = re.search(pattern, content, re.DOTALL)

              if not match:
                  raise SystemExit(
                      f"Array '{array_name}' was not found"
                  )

              body = match.group(2)

              if f"<item>{version}</item>" in body:
                  print(f"{array_name}: {version} already exists")
                  continue

              new_item = f"        <item>{version}</item>\n"

              body = body.rstrip() + "\n" + new_item

              replacement = (
                  match.group(1)
                  + body
                  + match.group(3)
              )

              content = (
                  content[:match.start()]
                  + replacement
                  + content[match.end():]
              )

              print(f"{array_name}: added {version}")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Commit version update
        id: commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main/res/values/arrays.xml

          if git diff --cached --quiet; then
            echo "Version already exists."
          else
            git commit -m "Update supported WhatsApp version to ${VERSION}"
            git push
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    name: Build & Release
    needs: update-version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout updated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.update-version.outputs.commit_sha }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Get version and SHA
        id: vars
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed -n 's/.*versionName = "\([^"]*\)".*/\1/p')
          SHA8=$(git rev-parse --short=8 HEAD)

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine versionName from app/build.gradle.kts"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION-$SHA8" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          echo "Tag: $VERSION-$SHA8"

      - name: Write signing key
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          if [ -z "$KEY_STORE" ]; then
            echo "::error::KEY_STORE secret is not set."
            exit 1
          fi

          echo "androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}'" >> gradle.properties
          echo "androidKeyAlias='${{ secrets.ALIAS }}'" >> gradle.properties
          echo "androidKeyPassword='${{ secrets.KEY_PASSWORD }}'" >> gradle.properties
          echo "androidStoreFile='key.jks'" >> gradle.properties

          echo "$KEY_STORE" | base64 --decode > key.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all variants
        run: |
          ./gradlew \
            assembleWhatsappDebug \
            assembleBusinessDebug \
            -Pminify=true

      - name: Verify APKs
        run: |
          ls -lh app/build/outputs/apk/whatsapp/debug/WaEnhancer*.apk
          ls -lh app/build/outputs/apk/business/debug/WaEnhancer-Business*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: WaEnhancer ${{ steps.vars.outputs.version }}
          tag_name: ${{ steps.vars.outputs.tag }}
          body_path: changelog.txt
          files: |
            app/build/outputs/apk/whatsapp/debug/WaEnhancer*.apk
            app/build/outputs/apk/business/debug/WaEnhancer-Business*.apk
          draft: false
          prerelease: false
          generate_release_notes: false
