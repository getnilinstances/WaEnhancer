name: Add Ver

on:
  workflow_dispatch:
    inputs:
      version:
        description: "WhatsApp version (e.g. 2.26.33)"
        required: true

permissions:
  contents: write

jobs:
  add-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}

      - name: Update versions
        run: |
          VERSION="${{ inputs.version }}"
          WA_VERSION="${VERSION}.xx"
          FILE="app/src/main/res/values/arrays.xml"

          python3 - "$FILE" "$WA_VERSION" <<'PY'
          import sys
          import re

          file = sys.argv[1]
          version = sys.argv[2]

          with open(file, "r", encoding="utf-8") as f:
              content = f.read()

          arrays = [
              "supported_versions_wpp",
              "supported_versions_business"
          ]

          for array_name in arrays:
              pattern = (
                  rf'(<string-array name="{array_name}">)'
                  rf'(.*?)'
                  rf'(</string-array>)'
              )

              def update(match):
                  opening = match.group(1)
                  body = match.group(2)
                  closing = match.group(3)

                  if f"<item>{version}</item>" not in body:
                      body = body.rstrip()
                      body += f"\n        <item>{version}</item>\n    "

                  return opening + body + closing

              content, count = re.subn(
                  pattern,
                  update,
                  content,
                  count=1,
                  flags=re.DOTALL
              )

              if count == 0:
                  raise SystemExit(
                      f"Array '{array_name}' was not found"
                  )

          with open(file, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Update app version
        run: |
          FILE="app/build.gradle.kts"
          VERSION="${{ inputs.version }}"

          CURRENT_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$FILE" | head -1)

          if [ -z "$CURRENT_CODE" ]; then
            echo "Could not find versionCode"
            exit 1
          fi

          NEW_CODE=$((CURRENT_CODE + 1))

          sed -i -E \
            "s/versionCode = [0-9]+/versionCode = $NEW_CODE/" \
            "$FILE"

          sed -i -E \
            "s/versionName = \"[0-9]+\.[0-9]+\.[0-9]+ \(\$gitHash\)\"/versionName = \"$VERSION (\$gitHash)\"/" \
            "$FILE"

          sed -i -E \
            's/outputFileName\.set\("\$appName-[0-9]+\.[0-9]+\.[0-9]+ \(\$gitHash\)\.apk"\)/outputFileName.set("\$appName-'$VERSION' (\$gitHash).apk")/' \
            "$FILE"

          echo "Updated:"
          grep -E 'versionCode|versionName|outputFileName' "$FILE"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main/res/values/arrays.xml app/build.gradle.kts

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update version ${{ inputs.version }}"
          git push
