name: Add Ver

on:
  workflow_dispatch:
    inputs:
      version:
        description: "WhatsApp version"
        required: true

permissions:
  contents: write

jobs:
  add-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update versions
        run: |
          VERSION="${{ inputs.version }}"
          WA_VERSION="${VERSION}.xx"
          FILE="app/src/main/res/values/arrays.xml"

          for ARRAY in supported_versions_wpp supported_versions_business; do
            if ! grep -q "<string-array name=\"$ARRAY\">" "$FILE"; then
              echo "Array '$ARRAY' was not found"
              exit 1
            fi

            if ! sed -n "/<string-array name=\"$ARRAY\">/,/<\/string-array>/p" "$FILE" | grep -q "<item>$WA_VERSION</item>"; then
              sed -i "/<string-array name=\"$ARRAY\">/,/<\/string-array>/{
                /<\/string-array>/i\        <item>$WA_VERSION</item>
              }" "$FILE"
            fi
          done

      - name: Update app version
        run: |
          FILE="app/build.gradle.kts"
          VERSION="${{ inputs.version }}"

          CURRENT_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$FILE" | head -1)

          if [ -z "$CURRENT_CODE" ]; then
            echo "Could not find versionCode"
            exit 1
          fi

          NEW_CODE=$((CURRENT_CODE + 1))

          sed -i -E \
            "s/versionCode = [0-9]+/versionCode = $NEW_CODE/" \
            "$FILE"

          sed -i -E \
            "s/versionName = \"[0-9]+\.[0-9]+\.[0-9]+ \(\$gitHash\)\"/versionName = \"$VERSION (\$gitHash)\"/" \
            "$FILE"

          sed -i -E \
            "s/outputFileName\.set\(\"\$appName-[0-9]+\.[0-9]+\.[0-9]+ \(\$gitHash\)\.apk\"\)/outputFileName.set(\"\$appName-$VERSION (\$gitHash).apk\")/" \
            "$FILE"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main/res/values/arrays.xml app/build.gradle.kts

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update version ${{ inputs.version }}"
          git push
